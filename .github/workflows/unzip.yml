name: Unzip root ZIP files
on:
  workflow_dispatch:
    inputs:
      zip_pattern:
        description: "（任意）ルートで探す zip のパターン（デフォルト: *.zip)"
        required: false
        default: "*.zip"

jobs:
  unzip:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Find and unzip files in repository root
        run: |
          set -euo pipefail
          pattern="${{ github.event.inputs.zip_pattern || '*.zip' }}"
          echo "Using pattern: $pattern"
          shopt -s nullglob
          cd "$GITHUB_WORKSPACE"
          files=( $pattern )
          if [ ${#files[@]} -eq 0 ]; then
            echo "No zip files found matching '$pattern' in repo root."
            exit 0
          fi
          for f in "${files[@]}"; do
            echo "Unzipping: $f -> repo root"
            unzip -o "$f" -d .
          done

      - name: Commit and push extracted files (using PAT)
        env:
          ACTIONS_PAT: ${{ secrets.ACTIONS_PAT }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          # If you don't want to overwrite workflow files with this push, uncomment the next line:
          # git restore --staged .github/workflows || true
          if git diff --staged --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git commit -m "Unzip files from workflow"
          # Use personal access token to authenticate push so workflows can be created/updated
          if [ -z "${ACTIONS_PAT}" ]; then
            echo "ERROR: ACTIONS_PAT secret is empty. Please add a repository secret named ACTIONS_PAT with a PAT that has repo and workflow permissions."
            exit 1
          fi
          git remote set-url origin "https://x-access-token:${ACTIONS_PAT}@github.com/${{ github.repository }}.git"
          git push origin HEAD:${{ github.ref_name }}
