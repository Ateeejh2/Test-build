name: Unzip root ZIP files (do not change workflows)
on:
  workflow_dispatch:
    inputs:
      zip_pattern:
        description: "（任意）ルートで探す zip のパターン（デフォルト: *.zip）"
        required: false
        default: "*.zip"

jobs:
  unzip:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Find and unzip files in repository root
        run: |
          set -euo pipefail
          pattern="${{ github.event.inputs.zip_pattern || '*.zip' }}"
          echo "Using pattern: $pattern"
          shopt -s nullglob
          cd "$GITHUB_WORKSPACE"
          files=( $pattern )
          if [ ${#files[@]} -eq 0 ]; then
            echo "No zip files found matching '$pattern' in repo root."
            exit 0
          fi
          for f in "${files[@]}"; do
            echo "Unzipping: $f -> repo root"
            unzip -o "$f" -d .
          done

      - name: Commit and push extracted files (exclude .github/workflows)
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # Stage all changes
          git add -A

          # Ensure workflow files are NOT staged/committed
          # Unstage any changes under .github/workflows (safe if dir doesn't exist)
          git restore --staged .github/workflows || true
          git reset -- .github/workflows || true

          # Also ensure untracked workflow files are not removed/added by cleaning later:
          # (we don't run git clean here for unzip, but keep the pattern consistent)

          if git diff --staged --quiet; then
            echo "No changes to commit (excluding .github/workflows)."
            exit 0
          fi

          git commit -m "Unzip files from workflow (excluding .github/workflows)"
          git push
