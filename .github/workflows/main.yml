name: Unzip and commit

on:
  workflow_dispatch:
  push:
    paths:
      - '**/*.zip'

jobs:
  unzip-and-commit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Find ZIP (first match) and list
        run: |
          ZIP_PATH=$(git ls-files '*.zip' | head -n 1)
          if [ -z "$ZIP_PATH" ]; then
            echo "No zip file found in the repository."
            exit 1
          fi
          echo "Found: $ZIP_PATH"
          unzip -l "$ZIP_PATH"
          echo "ZIP_PATH=$ZIP_PATH" >> $GITHUB_ENV

      - name: Unzip into folder
        run: |
          mkdir -p unzipped
          unzip "$ZIP_PATH" -d unzipped

      - name: Commit unzipped contents
        uses: stefanzweifel/git-auto-commit-action@v4
        with:
          commit_message: "Unzip: add contents of ${{ env.ZIP_PATH }}"
          file_pattern: "unzipped/**"
