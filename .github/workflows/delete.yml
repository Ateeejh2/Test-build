name: Delete all project files (manual, requires confirmation)
on:
  workflow_dispatch:
    inputs:
      confirm:
        description: '確認のため "DELETE" と入力してください（大文字必須）'
        required: true

jobs:
  delete:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Safety check (confirm input)
        run: |
          if [ "${{ github.event.inputs.confirm }}" != "DELETE" ]; then
            echo "Confirmation not provided or incorrect. Aborting."
            exit 1
          fi
          echo "Confirmation OK. Proceeding to remove tracked and untracked files."

      - name: Remove tracked files except workflow files
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # Directory to preserve (workflow files)
          preserve_dir=".github/workflows"

          # Collect tracked files except those under .github/workflows
          files_to_remove=()
          while IFS= read -r -d '' f; do
            case "$f" in
              "$preserve_dir"/*|"$preserve_dir") continue ;;
            esac
            files_to_remove+=("$f")
          done < <(git ls-files -z)

          if [ ${#files_to_remove[@]} -gt 0 ]; then
            printf '%s\0' "${files_to_remove[@]}" | xargs -0 --no-run-if-empty git rm -rf --
          else
            echo "No tracked files to remove (after excluding workflows)."
          fi

      - name: Remove untracked files and directories except workflow files
        shell: bash
        run: |
          # git clean -e preserves matching paths; we exclude the workflows directory
          # -f: force, -d: directories, -x: remove ignored too
          git clean -fdx -e .github/workflows || true

      - name: Commit and push removal
        shell: bash
        run: |
          if git diff --cached --quiet; then
            echo "No changes to commit after removal. Exiting."
            exit 0
          fi
          git commit -m "Remove all project files via workflow (confirmed)"
          git push
