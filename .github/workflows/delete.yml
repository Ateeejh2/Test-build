name: Delete all project files (manual, requires confirmation)
on:
  workflow_dispatch:
    inputs:
      confirm:
        description: '確認のため "DELETE" と入力してください（大文字必須）'
        required: true

jobs:
  delete:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Safety check (confirm input)
        run: |
          if [ "${{ github.event.inputs.confirm }}" != "DELETE" ]; then
            echo "Confirmation not provided or incorrect. Aborting."
            exit 1
          fi
          echo "Confirmation OK. Proceeding to remove tracked and untracked files."

      - name: Remove tracked files
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # Remove all tracked files (safe listing+remove)
          tracked_files=$(git ls-files -z | tr '\0' '\n' || true)
          if [ -n "$tracked_files" ]; then
            echo "$tracked_files" | xargs -r -d '\n' git rm -f --
          else
            echo "No tracked files to remove."
          fi

          # Remove untracked files and directories (including ignored)
          git clean -fdx || true

          # If no staged changes, exit
          if git diff --cached --quiet; then
            echo "No changes to commit after removal. Exiting."
            exit 0
          fi

          git commit -m "Remove all project files via workflow (confirmed)"
          git push
